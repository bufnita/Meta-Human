# This is a basic workflow to help you get started with Actions

name: Backend CI/CD (ASP.NET Core)

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
    paths: [ "backend/**" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "backend/**" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build-and-deploy:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout cod sursă
        uses: actions/checkout@v4

      # Configurare .NET - versiune?
      - name: Configurare .NET mediul de rulare
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' # AJUSTEAZA VERSIUNEA !!!

      - name: Restore dependencies (Pachete NuGet)
        run: dotnet restore
  
      - name: Build aplicație
        run: dotnet build --no-restore --configuration Release
  
      - name: Publish aplicație (Pregătire fișiere pentru producție)
        run: dotnet publish --no-build --configuration Release --output ./publish
  
      # --- Secțiunea de Deployment (CD) ---
      # Această secțiune va trimite fișierele prin tunelul Wireguard în LXC 2
      - name: Deploy to LXC 2 (Backend ASP.NET)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Aici vom adăuga scriptul de copiere a fișierelor (ex: rsync / scp) către serverul intern."
          echo "Alternativ, acest pas va rula direct pe un self-hosted runner instalat în Proxmox."
