name: Frontend PRODUCTION

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: production

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Create environment file
        run: |
          cat > .env.production << EOF
          VITE_API_URL=/api
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Create target directory
        run: |
          ssh root@10.10.10.220 \
            "mkdir -p /var/www/metahuman"

      - name: Deploy files
        run: |
          rsync -a --delete \
            ./dist/ \
            root@10.10.10.220:/var/www/metahuman/

      - name: Verify deployment
        run: |
          ssh root@10.10.10.220 \
            "ls -lah /var/www/metahuman | head"
