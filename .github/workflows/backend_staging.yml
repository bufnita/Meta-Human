name: Backend STAGING

on:
  push:
    branches:
      - staging
    paths:
      - "backend/**"

jobs:
  deploy:
    runs-on: self-hosted

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish ASP.NET Core
        run: dotnet publish -c Release -o ./publish

      - name: Deploy files
        run: |
          rm -rf /opt/backend-staging/*
          cp -r ./publish/* /opt/backend-staging/

      - name: Restart backend
        run: sudo systemctl restart backend-staging

      - name: Show service status
        run: sudo systemctl status backend-staging --no-pager
